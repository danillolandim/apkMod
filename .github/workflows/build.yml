# Compila o APK na nuvem e publica numa Release "latest" com URL fixa.
# Essa URL serve direto no app Downloader da TV (ou pra gerar um código).
#
# Como usar:
#   1. Crie um repositório no GitHub e envie esta pasta (tvplayer-mod).
#   2. Em Settings → Actions → General → Workflow permissions, marque
#      "Read and write permissions" (para o workflow poder criar a Release).
#   3. Cada push na branch main gera o APK. O link fica em:
#      https://github.com/<usuario>/<repo>/releases/download/latest/player-mod.apk

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME definido,
      # licenças aceitas). O Android Gradle Plugin baixa platform/build-tools
      # que faltarem. Não é preciso nenhuma action extra de SDK.
      - name: Android SDK (pré-instalado no runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null | head -20
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Grava a saída num arquivo e, se falhar, publica as linhas de erro como
      # anotações do run e no resumo do job (visíveis pela API/página mesmo
      # sem baixar o log completo).
      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Reportar erros (se falhou)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          echo "## Build falhou" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -nE "^e: |error:|FAILURE|What went wrong|Caused by|Could not|Unresolved|not found|Execution failed" build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong|Caused by|Could not resolve|Unresolved reference|Execution failed" build.log \
            | sed 's/[%\r]//g' | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk player-mod.apk

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-mod-apk
          path: player-mod.apk

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Player Mod (último build)
          files: player-mod.apk
          prerelease: true
